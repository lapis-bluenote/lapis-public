<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a0612;
  --bg-purple: #140e24;
  --purple-dark: #1a1030;
  --purple-mid: #2d1b5e;
  --purple-light: #6b3fa0;
  --gold: #d4a843;
  --gold-light: #f0d080;
  --gold-pale: #f5e6c0;
  --text-main: #e8e0f0;
  --text-dim: #9a8fb5;
  --card-bg: #1e1438;
}

html, body {
  width: 100%; min-height: 100vh; overflow-x: hidden;
  font-family: 'Noto Serif JP', serif;
  background: var(--bg-deep);
  color: var(--text-main);
}

/* ===== STARFIELD BACKGROUND ===== */
#starfield {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.star {
  position: absolute; border-radius: 50%; background: #fff;
}

/* ===== SCREENS ===== */
.screen {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; position: relative; z-index: 1; padding: 2rem 1.5rem;
  text-align: center;
}
.screen.active { display: flex; }

/* ===== SCREEN 1: WELCOME ===== */
#screen-welcome {
  gap: 1.5rem;
}
.welcome-ornament {
  width: 80px; height: 80px; opacity: 0.6;
  animation: float 4s ease-in-out infinite;
}
.welcome-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.5rem, 5vw, 2.6rem);
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.5;
  text-shadow: none;
  filter: drop-shadow(0 0 20px rgba(212, 168, 67, 0.3));
}
.welcome-sub {
  font-size: clamp(0.85rem, 2.5vw, 1.05rem);
  color: var(--text-dim);
  letter-spacing: 0.08em;
  line-height: 1.8;
}
.welcome-divider {
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* ===== BUTTONS ===== */
.btn {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  font-weight: 600;
  padding: 1rem 2.5rem;
  border: 1.5px solid var(--gold);
  background: linear-gradient(135deg, rgba(212,168,67,0.1), rgba(212,168,67,0.05));
  color: var(--gold-light);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.15em;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(212,168,67,0.2), transparent);
  opacity: 0; transition: opacity 0.4s;
}
.btn:hover::before { opacity: 1; }
.btn:hover {
  box-shadow: 0 0 30px rgba(212,168,67,0.25), inset 0 0 30px rgba(212,168,67,0.05);
  transform: translateY(-2px);
}
.btn:active { transform: translateY(0); }

/* ===== SCREEN 2: CARD DRAW ===== */
#screen-draw {
  gap: 1rem;
}
#drawTexts {
  transition: opacity 0.6s ease, max-height 0.6s ease, margin 0.6s ease;
  max-height: 200px; overflow: hidden;
}
#drawTexts.hidden {
  opacity: 0; max-height: 0; margin: 0;
  pointer-events: none;
}
.draw-text {
  font-size: clamp(0.85rem, 2.5vw, 1rem);
  color: var(--text-dim);
  line-height: 1.9;
  max-width: 400px;
  opacity: 0;
  animation: fadeUp 0.8s ease forwards;
}
.draw-text:nth-child(2) { animation-delay: 0.3s; }

/* ===== CARD CONTAINER ===== */
.card-container {
  perspective: 1200px;
  width: clamp(200px, 55vw, 260px);
  height: clamp(310px, 85vw, 400px);
  margin: 1rem 0;
  cursor: pointer;
}
.card-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.9s cubic-bezier(0.4, 0.0, 0.2, 1);
  transform-style: preserve-3d;
}
.card-inner.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 12px;
  overflow: hidden;
}

/* ===== CARD BACK ===== */
.card-back {
  background: var(--card-bg);
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(107,63,160,0.3), 0 0 80px rgba(107,63,160,0.1);
}
.card-back-pattern {
  width: 100%; height: 100%;
}

/* ===== CARD FRONT ===== */
.card-front {
  transform: rotateY(180deg);
  background: linear-gradient(170deg, #1a1230, #0f0a1e);
  border: 2px solid var(--gold);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1.2rem;
  gap: 0.5rem;
  box-shadow: 0 0 40px rgba(212,168,67,0.15), 0 0 80px rgba(107,63,160,0.2);
}
.card-number {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.75rem;
  color: var(--gold);
  letter-spacing: 0.2em;
  opacity: 0.8;
}
.card-icon-wrap {
  width: clamp(70px, 20vw, 100px); height: clamp(70px, 20vw, 100px);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s;
}
.card-icon-wrap.reversed { transform: rotate(180deg); }
.card-icon-wrap svg { width: 100%; height: 100%; }
.card-name-jp {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  font-weight: 700;
  color: var(--gold-light);
}
.card-name-en {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.65rem, 2vw, 0.8rem);
  color: var(--gold);
  letter-spacing: 0.15em;
  opacity: 0.8;
}
.card-orientation {
  font-size: 0.7rem;
  padding: 0.2rem 0.8rem;
  border: 1px solid;
  border-radius: 2px;
  letter-spacing: 0.1em;
}
.card-orientation.upright {
  color: var(--gold-light); border-color: var(--gold);
}
.card-orientation.reversed-label {
  color: #b48ede; border-color: #8a6cb8;
}
.card-keywords {
  font-size: clamp(0.7rem, 2vw, 0.8rem);
  color: var(--text-dim);
  letter-spacing: 0.05em;
}
.card-divider {
  width: 60%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
}
.card-message {
  font-size: clamp(0.6rem, 1.8vw, 0.72rem);
  color: var(--text-dim);
  line-height: 1.8;
  text-align: center;
  max-width: 95%;
}

/* ===== SCREEN 3: RESULT ===== */
#screen-result { gap: 1rem; }
.result-card-container {
  perspective: 1200px;
  width: clamp(220px, 60vw, 280px);
  height: clamp(340px, 92vw, 430px);
}
.result-card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
}

/* ===== CARD APPEAR ANIMATION ===== */
.card-appear {
  opacity: 0;
  animation: cardAppear 1s ease forwards 0.2s;
}
@keyframes cardAppear {
  0% { opacity: 0; transform: scale(0.85) translateY(30px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* ===== CARD HOVER/SWAY ===== */
.card-sway {
  animation: sway 3s ease-in-out infinite;
}
@keyframes sway {
  0%, 100% { transform: rotate(-1.5deg) translateY(0); }
  50% { transform: rotate(1.5deg) translateY(-6px); }
}

/* ===== GENERAL ANIMATIONS ===== */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}
.fade-in { animation: fadeIn 0.8s ease forwards; }
.fade-in-delay { opacity: 0; animation: fadeIn 0.8s ease forwards 0.5s; }
.fade-in-delay2 { opacity: 0; animation: fadeIn 0.8s ease forwards 1s; }

/* ===== GLOW BURST ON FLIP ===== */
.glow-burst {
  position: absolute; inset: -50%; border-radius: 50%;
  background: radial-gradient(circle, rgba(212,168,67,0.3), transparent 60%);
  opacity: 0; pointer-events: none; z-index: -1;
  animation: burstGlow 1.2s ease forwards;
}
@keyframes burstGlow {
  0% { opacity: 0; transform: scale(0.5); }
  40% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.5); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 400px) {
  .screen { padding: 1.5rem 1rem; }
  .card-message { font-size: 0.58rem; }
}
</style>
</head>

// ===== STARFIELD =====
function createStarfield() {
  const sf = document.getElementById('starfield');
  sf.innerHTML = '';
  const count = Math.min(150, Math.floor(window.innerWidth * window.innerHeight / 5000));
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.cssText = `
      width: ${size}px; height: ${size}px;
      left: ${Math.random() * 100}%; top: ${Math.random() * 100}%;
      opacity: ${Math.random() * 0.6 + 0.1};
      animation: twinkle ${Math.random() * 4 + 2}s ease-in-out ${Math.random() * 4}s infinite;
    `;
    sf.appendChild(star);
  }
}
createStarfield();

// ===== APP STATE =====
let currentCard = null;
let isUpright = true;
let isFlipped = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goToDraw() {
  // Pick random card & orientation
  currentCard = cards[Math.floor(Math.random() * cards.length)];
  isUpright = Math.random() > 0.5;
  isFlipped = false;

  // Reset card state
  const inner = document.getElementById('cardInner');
  inner.classList.remove('flipped');
  inner.classList.add('card-sway');
  document.getElementById('resetWrap').style.display = 'none';

  // Build front face
  buildCardFront();

  // Re-trigger appear animation
  const container = document.getElementById('cardContainer');
  container.classList.remove('card-appear');
  void container.offsetWidth; // force reflow
  container.classList.add('card-appear');

  showScreen('screen-draw');
}

function buildCardFront() {
  const c = currentCard;
  const kw = isUpright ? c.upKw : c.revKw;
  const msg = isUpright ? c.upMsg : c.revMsg;
  const orientLabel = isUpright ? '正位置' : '逆位置';
  const orientClass = isUpright ? 'upright' : 'reversed-label';
  const iconClass = isUpright ? '' : 'reversed';

  document.getElementById('cardFront').innerHTML = `
    <span class="card-number">${c.num}</span>
    <div class="card-icon-wrap ${iconClass}">${c.icon}</div>
    <span class="card-name-jp">${c.nameJp}</span>
    <span class="card-name-en">${c.nameEn}</span>
    <span class="card-orientation ${orientClass}">${orientLabel}</span>
    <div class="card-divider"></div>
    <span class="card-keywords">${kw.join(' ・ ')}</span>
    <div class="card-divider"></div>
    <p class="card-message">${msg}</p>
  `;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;

  const inner = document.getElementById('cardInner');
  inner.classList.remove('card-sway');
  inner.classList.add('flipped');

  // Hide draw texts
  document.getElementById('drawTexts').classList.add('hidden');

  // Show glow burst
  const container = document.getElementById('cardContainer');
  const glow = document.createElement('div');
  glow.className = 'glow-burst';
  container.appendChild(glow);
  setTimeout(() => glow.remove(), 1300);

  // Show reset button after flip completes
  setTimeout(() => {
    const wrap = document.getElementById('resetWrap');
    wrap.style.display = 'block';
    wrap.style.opacity = '0';
    wrap.offsetWidth;
    wrap.style.transition = 'opacity 0.8s ease';
    wrap.style.opacity = '1';
  }, 1000);
}

function resetApp() {
  document.getElementById('resetWrap').style.display = 'none';
  document.getElementById('drawTexts').classList.remove('hidden');
  showScreen('screen-welcome');
}
</script>
